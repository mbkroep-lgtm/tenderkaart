name: Bronnen testen (tijdelijk)
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe.mjs
      - run: |
          git config user.name "tenderkaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json && git commit -q -m "Testresultaat bronnen" && git push -q origin HEAD:diag
