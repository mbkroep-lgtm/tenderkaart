name: Voorbeeld satellieten (tijdelijk)
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  sats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sgp4 && python scripts/sats.py
      - run: |
          git config user.name "tenderkaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview && git commit -q -m "Voorbeelddata satellieten" && git push -q origin HEAD:diag
