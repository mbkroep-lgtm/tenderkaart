name: Bronnen testen (tijdelijk)
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/za.mjs
      - if: always()
        run: |
          git config user.name "tenderkaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview && git commit -q -m "Testresultaat" && git push -q origin HEAD:diag
