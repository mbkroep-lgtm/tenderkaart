name: Tenders ophalen (TED, Wereldbank, Find a Tender)

on:
  schedule:
    - cron: '17 5 * * 1-5'   # elke werkdag rond 06:17/07:17 Nederlandse tijd
  workflow_dispatch:          # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: ted-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tenders ophalen
        run: node scripts/fetch-tenders.mjs
      - name: Opslaan
        run: |
          git config user.name "tenderkaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git commit -m "Tenders bijgewerkt $(date -u +%F)"
          # is er intussen iets anders naar GitHub gezet? Dan eerst bijwerken en opnieuw proberen.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Opslaan lukte niet (poging $i), even wachten…"
            sleep $((i * 10))
          done
          exit 1
