name: Tenders ophalen bij TED

on:
  schedule:
    - cron: '17 5 * * 1-5'   # elke werkdag rond 06:17/07:17 Nederlandse tijd
  workflow_dispatch:          # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: ted-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tenders ophalen
        run: node scripts/fetch-ted.mjs
      - name: Opslaan
        run: |
          git config user.name "tenderkaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Tenders bijgewerkt $(date -u +%F)"
            git push
          fi
