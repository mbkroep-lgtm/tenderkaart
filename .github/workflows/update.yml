name: Tenders ophalen

on:
  schedule:
    # elke werkdag een paar keer: GitHub slaat geplande taken soms over, en een extra ronde kost niets
    - cron: '17 5 * * 1-5'
    - cron: '47 9 * * 1-5'
    - cron: '23 13 * * 1-5'
    # weekend: één ronde per dag is genoeg (er wordt dan weinig gepubliceerd)
    - cron: '17 6 * * 0,6'
  workflow_dispatch:          # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: ted-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # altijd de nieuwste versie, ook als de taak in de wachtrij stond
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sommige overheidsservers (bv. base.gov.pt) sturen hun tussencertificaat niet mee. Browsers halen dat zelf op;
      # Node niet. Hier halen we het op via het adres in het certificaat zelf. De controle blijft gewoon aan.
      - name: Ontbrekende tussencertificaten aanvullen
        run: |
          out="$RUNNER_TEMP/extra-ca.pem"; : > "$out"
          for h in www.base.gov.pt; do
            url=$(echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -ext authorityInfoAccess 2>/dev/null | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | sed 's/.*URI://')
            if [ -n "$url" ] && curl -fsSL -m 20 "$url" -o "$RUNNER_TEMP/i.crt"; then
              (openssl x509 -inform DER -in "$RUNNER_TEMP/i.crt" -outform PEM 2>/dev/null || openssl x509 -in "$RUNNER_TEMP/i.crt") >> "$out" && echo "$h: tussencertificaat toegevoegd ($url)"
            else echo "$h: geen tussencertificaat gevonden"; fi
          done
          [ -s "$out" ] && echo "NODE_EXTRA_CA_CERTS=$out" >> "$GITHUB_ENV" || true
      - name: Tenders ophalen
        run: node scripts/fetch-tenders.mjs
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      - name: Opslaan
        run: |
          git config user.name "tenderkaart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/tenders.json "$RUNNER_TEMP/tenders.json"
          for i in 1 2 3 4 5; do
            # altijd bovenop de nieuwste versie: het verse resultaat van deze ronde wint
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/tenders.json" data/tenders.json
            git add data/tenders.json
            if git diff --cached --quiet; then echo "Geen wijzigingen."; exit 0; fi
            git commit -q -m "Tenders bijgewerkt $(date -u +%F)"
            git push -q origin HEAD:main && exit 0
            echo "Opslaan lukte niet (poging $i), even wachten…"
            sleep $((i * 10))
          done
          exit 1
